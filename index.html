<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free marketing assessment | The Morning Owl</title>
<meta name="description" content="Answer a few questions about your business and see where your marketing may be losing results before you spend more.">
<meta name="theme-color" content="#004944">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#004944; --pine-2:#0b5c56; --misty:#B3CFCD; --frosty:#E4E9E9; --ivora:#F9F7F2; --obsidian:#121826;
  --tangerine:#FF8C5B; --quill:#DCDBD7; --verdin:#5c6661; --white:#ffffff; --error:#a3261b;
  --head:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-card:14px; --r-panel:22px; --navh:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivora);color:var(--obsidian);font:400 16px/1.65 var(--body);overflow-wrap:break-word}
h1,h2,h3{font-family:var(--head);color:var(--pine);font-weight:600;line-height:1.2;margin:0}
p{margin:0 0 1em}
a{color:var(--pine);text-underline-offset:3px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pine);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.user-text{overflow-wrap:anywhere}

/* header */
.top{padding:calc(16px + env(safe-area-inset-top,0px)) 0 16px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:600 17px/1 var(--head);color:var(--pine);text-decoration:none;display:flex;align-items:center;gap:10px;min-height:44px}
.brand img{height:64px;width:auto;display:block}
@media (max-width:600px){.brand img{height:50px}}
.top small{font-size:13px;color:var(--verdin);text-align:right}
.setup{background:#fff3ec;border:1px solid var(--tangerine);color:var(--obsidian);font-size:14px;padding:10px 14px;border-radius:10px;margin:0 auto 12px;max-width:680px;width:calc(100% - 40px)}
.loading{padding:48px 0;color:var(--verdin)}

/* intro / landing */
body.is-intro #app,body.is-intro .top .wrap,body.is-intro footer .wrap{max-width:1080px}
h1[tabindex="-1"]:focus{outline:none}
.landing{padding:8px 0 8px}
.lp-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center;padding:28px 0 56px}
.lp-hero h1{font-size:clamp(30px,4vw,46px);font-weight:500;line-height:1.1;letter-spacing:-.02em;color:var(--pine);max-width:20ch;margin:0 0 20px}
.lp-lede{font-size:18px;line-height:1.6;max-width:44ch;color:var(--obsidian);margin:0 0 26px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-content:start;gap:0;margin:0 0 30px;border-top:1.5px solid var(--quill);border-bottom:1.5px solid var(--quill)}
.facts div{padding:14px 22px 14px 0;margin-right:22px;border-right:1.5px solid var(--quill)}
.facts div:last-child{border-right:0;margin-right:0;padding-right:0}
.facts dt{font:500 19px/1.2 var(--head);color:var(--pine)}
.facts dd{margin:4px 0 0;font-size:13.5px;color:var(--verdin);line-height:1.35}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.cta-row .btn{padding:16px 30px;font-size:17px}
.cta-row small{font-size:14px;color:var(--verdin)}
.resume{margin-top:12px}

/* the example output */
.preview{position:relative;padding:0 0 132px 0;margin:0}
.pv-back{position:absolute;inset:44px -14px 0 34px;background:var(--pine);border-radius:22px;padding:20px 24px 22px;color:#cfe0de;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.pv-back p{margin:0 0 4px;font:500 16px/1.3 var(--head);color:var(--ivora)}
.pv-back i{display:block;height:8px;border-radius:5px;background:rgba(179,207,205,.35);margin:8px 0}
.pv-lock{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ivora);margin-top:10px}
.pv-lock svg{flex:none}
.pv-front{position:relative;background:var(--white);border:1.5px solid var(--quill);border-radius:22px;padding:24px 24px 22px;margin-right:34px;box-shadow:0 18px 40px -22px rgba(0,73,68,.45)}
.pv-tag{display:inline-block;font-size:13px;color:var(--verdin);background:var(--frosty);border-radius:999px;padding:5px 12px;margin-bottom:14px}
.pv-front .pv-label{font-size:14px;color:var(--verdin);margin:0 0 4px}
.pv-front h2{font-size:22px;font-weight:500;line-height:1.25;margin:0 0 12px}
.pv-front p{font-size:15px;line-height:1.55;margin:0 0 14px}
.pv-check{background:var(--frosty);border-left:5px solid var(--tangerine);border-radius:12px;padding:12px 14px}
.pv-check b{display:block;font:600 13.5px/1.3 var(--body);color:var(--pine);margin-bottom:2px}
.pv-check span{font-size:15px}

/* what you get */
.lp-get{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 56px}
.get{border-radius:22px;padding:28px 28px 26px}
.get.free{background:var(--white);border:1.5px solid var(--quill)}
.get.full{background:var(--pine);color:var(--ivora)}
.get h2{font-size:24px;font-weight:500;margin:0 0 6px}
.get.full h2{color:var(--ivora)}
.get .when{font-size:14.5px;color:var(--verdin);margin:0 0 16px}
.get.full .when{color:#cfe0de}
.get ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.get li{position:relative;padding-left:24px;line-height:1.5}
.get li::before{content:"";position:absolute;left:0;top:5px;width:10px;height:15px;background:var(--misty);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);border-radius:2px}
.get.full li::before{background:var(--tangerine)}

/* how it works (a real sequence) */
.lp-steps{margin:0 0 56px}
.lp-steps h2,.lp-for h2{font-size:clamp(24px,3.2vw,30px);font-weight:500;margin:0 0 20px}
.lp-steps ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:28px;counter-reset:s;max-width:820px}
.lp-steps li{counter-increment:s;border-top:3px solid var(--pine);padding-top:16px}
.lp-steps li::before{content:counter(s);display:block;font:500 34px/1 var(--head);color:var(--tangerine);margin-bottom:10px}
.lp-steps b{display:block;font:500 18px/1.3 var(--head);color:var(--pine);margin-bottom:6px}
.lp-steps span{font-size:15px;color:var(--obsidian)}

.lp-for{margin:0 0 48px}
.lp-for p{max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.chips li{background:var(--frosty);border-radius:999px;padding:8px 14px;font-size:14.5px}
.lp-end{background:var(--frosty);border-radius:22px;padding:34px 32px;display:grid;grid-template-columns:1fr auto;gap:18px 32px;align-items:center;margin:0 0 12px}
.lp-end h2{font-size:clamp(22px,3vw,28px);font-weight:500;margin:0 0 6px}
.lp-end p{margin:0;color:var(--verdin);font-size:15px}

@media (max-width:860px){
  .lp-hero{grid-template-columns:1fr;gap:40px;padding:12px 0 44px}
  .preview{max-width:520px}
  .lp-get{grid-template-columns:1fr}
  .lp-steps ol{grid-template-columns:1fr;gap:22px}
  .lp-end{grid-template-columns:1fr}
}
@media (max-width:600px){
  .lp-lede{font-size:17px}
  .facts{grid-template-columns:1fr 1fr;border-bottom:0}
  .facts div{margin-right:0;padding:12px 12px 12px 0;border-right:0;border-bottom:1.5px solid var(--quill)}
  .facts div:nth-child(odd){border-right:1.5px solid var(--quill)}
  .facts div:nth-child(even){padding-left:14px}
  .facts dt{font-size:20px}
  .cta-row .btn{width:100%}
  .cta-row small{width:100%;text-align:center}
  .pv-front{margin-right:14px;padding:20px 18px}
  .pv-back{inset:40px -4px 0 18px}
  .preview{padding-bottom:128px}
  .get{padding:24px 20px}
  .lp-end{padding:26px 20px}
  .lp-end .btn{width:100%}
}
.note{font-size:14px;color:var(--verdin);margin-top:18px}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:14px 26px;font:600 16px/1.2 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-decoration:none;text-align:center}
.btn-primary{background:var(--pine);color:var(--ivora)}
.btn-primary:hover{background:var(--pine-2)}
.btn-accent{background:var(--tangerine);color:var(--obsidian)}
.btn-accent:hover{background:#ff7d47}
.btn-ghost{background:var(--ivora);color:var(--pine);border:1.5px solid var(--pine)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-link{background:none;border:0;color:var(--pine);text-decoration:underline;cursor:pointer;padding:10px 4px;min-height:44px;font:500 15px var(--body)}

/* progress: owl rays */
.progress{display:flex;align-items:center;gap:14px;margin:4px 0 22px;min-height:24px}
.rays-bar{display:flex;gap:3px;align-items:flex-end;flex:1;max-width:340px;min-width:0}
.rays-bar i{flex:1;min-width:3px;height:18px;background:var(--quill);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);border-radius:2px;transition:background .25s}
.rays-bar i.on{background:var(--pine)}
.rays-bar i.now{background:var(--tangerine)}
.progress span{font-size:13px;color:var(--verdin);white-space:nowrap}

/* question */
.q h1{font-size:clamp(22px,5.4vw,30px);font-weight:500;margin-bottom:8px;outline:none}
.q .help{color:var(--verdin);font-size:15px;margin-bottom:20px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.opts{display:grid;gap:10px}
.opt{position:relative}
.opt > input{position:absolute;opacity:0;width:1px;height:1px}
.opt > label{display:flex;gap:14px;align-items:flex-start;background:var(--white);border:1.5px solid var(--quill);border-radius:var(--r-card);padding:14px 16px;min-height:52px;cursor:pointer;line-height:1.45;transition:border-color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.opt > label:hover{border-color:var(--misty)}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid var(--verdin);border-radius:50%;margin-top:1px;display:grid;place-items:center;background:#fff}
.opt.multi .mk{border-radius:6px}
.opt > input:checked + label{background:#eef4f3;border-color:var(--pine)}
.opt > input:checked + label .mk{border-color:var(--pine);background:var(--pine)}
.opt > input:checked + label .mk::after{content:"";width:6px;height:11px;border:solid var(--ivora);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt > input:focus-visible + label{outline:3px solid var(--pine);outline-offset:2px}
.opt > input:disabled + label{opacity:.45;cursor:not-allowed}
.opt .more{margin:8px 0 2px 0}
.hint{font-size:14px;color:var(--verdin);margin-top:12px;min-height:1.4em}
textarea,input[type=text],input[type=email],input[type=tel],input[type=url]{width:100%;border:1.5px solid var(--quill);border-radius:12px;background:#fff;padding:13px 14px;font-size:16px;line-height:1.45;min-height:50px}
textarea:focus,input:focus{border-color:var(--pine);outline:none;box-shadow:0 0 0 3px rgba(0,73,68,.18)}
textarea{min-height:120px;resize:vertical}
.count{font-size:13px;color:var(--verdin);text-align:right;margin-top:4px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-bottom:36px}
.saved{font-size:13px;color:var(--verdin);margin:10px 0 0;min-height:1.3em}

/* overview */
.overview{background:var(--white);border:1.5px solid var(--quill);border-radius:var(--r-panel);padding:28px 26px;margin-top:4px}
.overview h1{font-size:clamp(24px,5.6vw,32px);font-weight:500;margin-bottom:12px}
.situ{color:var(--verdin);font-size:15px}
.main-finding{font:500 clamp(19px,4.4vw,22px)/1.4 var(--head);color:var(--obsidian);margin-bottom:16px}
.lbl{font:600 14px/1.3 var(--body);color:var(--pine);margin:0 0 4px}
.checkbox{background:var(--frosty);border-radius:12px;padding:16px 18px;margin:16px 0;border-left:5px solid var(--tangerine)}
.checkbox p{margin:0}
.attempt{background:#fff8f3;border:1px solid #f5cdb8;border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 14px}
.muted{color:var(--verdin);font-size:14px}
.invite{background:var(--pine);color:var(--ivora);border-radius:var(--r-panel);padding:28px 26px;margin:18px 0 20px}
.invite h2{color:var(--ivora);font-size:clamp(20px,5vw,24px);font-weight:500;margin-bottom:18px}
.invite-sub{color:#e3ecea;font-size:15px;margin:14px 0 0}
.invite-lede{color:#e3ecea;margin:0 0 14px}
.flow{position:relative;margin:26px 0 20px}
.flow-intro{font:500 15px/1.3 var(--body);color:var(--verdin);margin:0 0 6px;padding:0 4px}
.flow-list{list-style:none;padding:0 4px;margin:0;user-select:none}
.flow-list li{--b:calc(var(--i) * 1.15px);padding:14px 0 16px;border-bottom:1.5px solid var(--quill);opacity:calc(1 - var(--i) * 0.16)}
.flow-h{display:block;font:500 17px/1.35 var(--head);color:var(--pine);margin-bottom:6px;filter:blur(calc(var(--b) * 0.8))}
.flow-t{display:block;font-size:15px;line-height:1.5;color:var(--obsidian);filter:blur(calc(3px + var(--b)))}
.flow-list li::after{content:"";display:block;height:6px;width:calc(92% - var(--i) * 9%);margin-top:10px;border-radius:4px;background:linear-gradient(90deg,var(--tangerine),var(--misty));opacity:.55;filter:blur(calc(var(--b) * 0.7))}
.flow-list li:nth-child(n+3)::after{background:var(--misty)}
.teaser-cta{position:relative;z-index:2;margin:-120px 0 0;background:var(--pine);color:var(--ivora);border-radius:20px;padding:26px 24px 24px;text-align:center;box-shadow:0 -40px 50px 10px var(--ivora),0 22px 44px -24px rgba(0,73,68,.6)}
.teaser-cta h2{color:var(--ivora);font-size:clamp(20px,4.6vw,24px);font-weight:500;margin:10px auto 10px;max-width:26ch}
.teaser-cta .invite-lede{color:#e3ecea;margin:0 auto 18px;max-width:46ch}
.teaser-cta .invite-sub{margin-top:12px}
.lock-badge{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--tangerine);color:var(--obsidian)}
.lock-badge svg{width:18px;height:20px}
@media (max-width:600px){.teaser-cta{margin-top:-100px;padding:22px 18px 20px}.teaser-cta .btn{width:100%}.flow-h{font-size:16px}}
@media print{.flow{display:none}}

ul.locked{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px}
ul.locked li{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;color:var(--ivora);line-height:1.45}
ul.locked svg{flex:none;margin-top:3px;color:var(--tangerine)}
.stakes{border-left:4px solid var(--pine);padding:2px 0 2px 16px;margin:18px 0}
.stakes p{margin:0}
.pv-stakes{font-size:14.5px;border-left:3px solid var(--pine);padding-left:12px}
.pv-stakes b{display:block;font:600 13.5px/1.3 var(--body);color:var(--pine);margin-bottom:2px}
.lp-pain{margin:0 0 56px}
.lp-pain h2{font-size:clamp(24px,3.2vw,30px);font-weight:500;margin:0 0 18px}
.lp-pain ul{list-style:none;padding:0;margin:0 0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lp-pain li{background:var(--white);border:1.5px solid var(--quill);border-top:4px solid var(--tangerine);border-radius:14px;padding:18px 18px 20px;font:500 17px/1.35 var(--head);color:var(--obsidian)}
.lp-pain > p{max-width:64ch;font-size:17px;margin:0}
@media (max-width:860px){.lp-pain ul{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.lp-pain ul{grid-template-columns:1fr}.lp-pain li{padding:14px 16px}}
.eyebrow{font:500 14px/1.3 var(--body);color:var(--verdin);margin:0 0 6px}
.invite p{color:#e3ecea}

/* form */
.form{background:var(--white);border:1.5px solid var(--quill);border-radius:var(--r-panel);padding:28px 26px;margin-top:4px}
.form h1{font-size:clamp(24px,5.6vw,30px);font-weight:500;margin-bottom:8px}
.field{margin:20px 0}
.field > label,.field legend{display:block;font:500 15px/1.4 var(--body);margin-bottom:8px;color:var(--obsidian)}
.field .opt-lbl{font-weight:400;color:var(--verdin)}
.fhint{font-size:14px;color:var(--verdin);margin:-2px 0 8px;line-height:1.45}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg .opt{flex:1 1 130px}
.seg .opt > label{padding:12px 18px;border-radius:999px;align-items:center}
.err{color:var(--error);font-size:14px;margin-top:6px}
input[aria-invalid=true]{border-color:var(--error)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:15px;margin:16px 0;padding:10px 0;min-height:44px;cursor:pointer}
.consent input{width:22px;height:22px;margin-top:2px;accent-color:var(--pine);flex:none}
.disclosure{font-size:14px;color:var(--verdin);margin:18px 0}
.disclosure a{display:inline-block;padding:10px 0;min-height:44px;line-height:24px}
.alert{background:#fbeae7;border:1px solid #e7b5ad;color:var(--obsidian);border-radius:12px;padding:14px 16px;margin:16px 0;font-size:15px}
.alert.info{background:#fff3ec;border-color:#f5cdb8}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* report */
.report{padding-bottom:24px}
.report > header{margin:4px 0 20px}
.report > header h1{font-size:clamp(26px,6vw,36px);font-weight:500;margin-bottom:10px}
.glance{background:var(--pine);color:var(--ivora);border-radius:var(--r-card);padding:18px 20px;margin:0 0 30px}
.glance p{margin:0 0 8px;color:#e3ecea}
.glance p:last-child{margin:0}
.glance b{color:var(--ivora);font-weight:600}
.report section{margin:0 0 34px}
.report h2{font-size:clamp(20px,4.8vw,23px);font-weight:500;margin-bottom:12px;padding-top:4px;display:flex;gap:10px;align-items:baseline}
.report h2 .n{font:600 14px/1 var(--body);color:var(--verdin);flex:none}
.report h3{font-size:18px;font-weight:500;margin:0 0 10px}
.summary{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 18px;background:var(--white);border:1.5px solid var(--quill);border-radius:var(--r-card);padding:18px 20px;margin:0 0 14px}
.summary dt{font-size:14px;color:var(--verdin)}
.summary dd{margin:0;font-weight:500}
.card{background:var(--white);border:1.5px solid var(--quill);border-radius:var(--r-card);padding:18px 20px;margin-bottom:14px}
.card.pri{border-color:var(--pine);border-width:2px}
.tag{display:inline-block;font:600 13px/1 var(--body);padding:7px 12px;border-radius:999px;margin-bottom:10px}
.tag.t0{background:var(--tangerine);color:var(--obsidian)}
.tag.t1{background:var(--misty);color:var(--obsidian)}
.ev{margin:4px 0 0;padding-left:18px}
.ev li{margin-bottom:4px}
.ev .qq{color:var(--verdin)}
.ctx{font-size:15px;background:var(--frosty);border-radius:12px;padding:12px 16px;margin-top:10px}
.ctx .lbl{display:block;margin-bottom:4px}
.ctx .muted{display:block;margin-top:6px}
.list{margin:0;padding-left:20px}
.list li{margin-bottom:10px}
.xtag{display:block;font-size:14px;color:#8a4b2c;margin-top:2px}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.checks li{background:var(--white);border:1.5px solid var(--quill);border-radius:12px;padding:14px 16px}
.checks li.first{border-color:var(--tangerine);background:#fff8f3}
.checks .for{display:block;font-size:14px;color:var(--verdin);margin-bottom:4px}
details{background:var(--white);border:1.5px solid var(--quill);border-radius:12px;margin:10px 0}
details > summary{cursor:pointer;list-style:none;padding:12px 44px 12px 16px;min-height:48px;display:flex;align-items:center;font:500 15px/1.4 var(--body);color:var(--pine);position:relative}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border:solid var(--pine);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);transition:transform .15s}
details[open] > summary::after{transform:translateY(-30%) rotate(-135deg)}
details > .in{padding:0 16px 14px}
.card details{border:0;margin:6px -4px 0;background:transparent}
.card details > summary{padding-left:4px}
.card details > .in{padding:0 4px 4px}
ol.actions{list-style:none;padding:0;margin:0;counter-reset:a;display:grid;gap:12px}
ol.actions li{counter-increment:a;position:relative;padding:16px 18px 16px 60px;background:var(--white);border:1.5px solid var(--quill);border-radius:var(--r-card)}
ol.actions li::before{content:counter(a);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--pine);color:var(--ivora);display:grid;place-items:center;font:600 15px var(--head)}
ol.actions strong{display:block;font:500 17px/1.35 var(--head);color:var(--pine);margin-bottom:4px}
.measures{display:grid;gap:10px}
.measures div{padding:12px 16px;border-left:4px solid var(--misty);background:var(--white);border-radius:0 12px 12px 0}
.measures b{font-weight:600;display:block}
.keep-row{display:flex;gap:10px;flex-wrap:wrap}
.keep-row input{flex:1 1 220px;min-width:0;font-size:16px}
.review{background:var(--pine);color:var(--ivora);border-radius:var(--r-panel);padding:28px 26px}
.review h2{color:var(--ivora);font-size:24px}
.review p{color:#e3ecea}
.review .done{background:rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;margin-top:12px}
.review .alert{background:#fbeae7;color:var(--obsidian)}
.after{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}
.test{background:var(--tangerine);color:var(--obsidian);font-weight:600;text-align:center;padding:8px;font-size:14px}
footer{padding:18px 0 calc(36px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--verdin)}
footer a{display:inline-block;padding:10px 0;min-height:44px;line-height:24px}

/* small screens */
@media (max-width:600px){
  .wrap{padding:0 16px}
  .setup{width:calc(100% - 32px)}
  .hero{padding:32px 20px 26px;border-radius:18px}
  .hero .btn{width:100%}
  .overview,.form,.invite,.review{padding:22px 18px}
  .invite .btn{width:100%}
  .summary{grid-template-columns:1fr;gap:0;padding:14px 16px}
  .summary dt{margin-top:8px}
  .summary dt:first-child{margin-top:0}
  .card{padding:16px}
  ol.actions li{padding:14px 14px 14px 54px}
  ol.actions li::before{left:14px;top:14px}
  .form .nav{flex-direction:column-reverse;gap:10px;padding-bottom:0}
  .form .nav .btn{width:100%}
  .keep-row .btn{width:100%}
  /* Continue / Back stay reachable while scrolling long option lists */
  .q .nav{position:sticky;bottom:0;z-index:5;margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--ivora) 78%,rgba(249,247,242,0));}
  .q .nav .btn{flex:1}
  /* When the on-screen keyboard is open, the bar returns to normal flow so it never covers the field */
  body.kb .q .nav{position:static;background:none;margin:18px 0 0;padding:0 0 24px}
}
@media (max-width:360px){
  body{font-size:15.5px}
  .progress{gap:10px}
  .progress span{font-size:12px}
  .opt > label{padding:13px 14px;gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .top small,.nav,.invite,.review,.after,.setup,footer,.test,.keep{display:none!important}
  body{background:#fff}
  details{border:0}
  details > summary::after{display:none}
  .card,.summary,ol.actions li,.checks li{break-inside:avoid}
}
</style>
</head>

  var FREE_EMAIL = ['gmail.com', 'googlemail.com', 'yahoo.com', 'yahoo.com.my', 'yahoo.co.uk', 'yahoo.com.sg', 'ymail.com', 'rocketmail.com', 'hotmail.com', 'hotmail.my',

    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 25000);
    fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload(hp)), signal: ctl ? ctl.signal : undefined, redirect: 'follow' })
      .then(function (res) { return res.json().catch(function () { return { ok: false }; }).then(function (j) { return { status: res.status, j: j }; }); })
      .then(function (r) {
        clearTimeout(timer); S.sending = false;
        if (r.j && r.j.ok === true && r.j.lead_id) {
          S.lead = { id: r.j.lead_id, token: r.j.token, method: 'email', at: Date.now() }; S.phase = 'report'; S.contact = null; S.subId = null;
          track('lead_submitted'); FUNNEL.send('unlocked', null, 'unlocked'); render(); return;
        }
        if (r.j && r.j.error === 'fields' && r.j.fields) {
          var map = { name: 'Enter your name.', email: 'Enter a valid email address.', link: 'Enter your business website, or the full link to your business’s social page or shop.',
            free_email: 'Please use your company email address.', throwaway: 'Temporary email addresses aren’t accepted. Please use your company email.',
            email_domain: 'We couldn’t find an email service for that address. Check the spelling.', link_domain: 'We couldn’t find a website at that address. Check it and try again.' };
          S.fieldErr = {}; Object.keys(r.j.fields).forEach(function (k) { var v = r.j.fields[k]; S.fieldErr[k] = map[v] || map[k] || 'Check this field.'; });
          S.error = 'Some details need checking before we can save them.';
        } else if (r.j && r.j.error === 'rate') S.error = 'There have been several attempts with these details. Wait a while, then try again. Your answers are still here.';
        else if (r.j && r.j.error === 'too_fast') S.error = 'That was quicker than we expected. Check your details, then try again.';
        else S.error = 'We couldn’t save your details, so the detailed diagnostic isn’t unlocked yet. Your answers and details are still here. Select Try again, or email info@themorningowl.co.';
        track('lead_submit_failed', { diag_error: (r.j && r.j.error) || String(r.status) }); FUNNEL.send('submit_failed', { detail: (r.j && r.j.error) || String(r.status) });
        renderForm(); var a = document.getElementById('formerr'); if (a) { a.setAttribute('tabindex', '-1'); a.focus(); }
      })
      .catch(function () {
        clearTimeout(timer); S.sending = false;
        S.error = 'We couldn’t reach our server, so the detailed diagnostic isn’t unlocked yet. Check your connection and select Try again. Your answers and details are still here.';
        track('lead_submit_failed', { diag_error: 'network' }); FUNNEL.send('submit_failed', { detail: 'network' });
        renderForm(); var a = document.getElementById('formerr'); if (a) { a.setAttribute('tabindex', '-1'); a.focus(); }
      });
  }

  /* ---------- render: detailed report ----------
     This is a simple lead-capture gate, not access control. The report is built in the browser
     from the same rules as the overview and shown once the backend confirms the save.
     Someone technical could read the rules or bring up a report without submitting. */
  function sec(n, title, inner) { return '<section><h2><span class="n">' + n + '</span><span>' + esc(title) + '</span></h2>' + inner + '</section>'; }
  function evList(f) { return '<ul class="ev">' + f.evidence.map(function (e) { return '<li><span class="qq">' + esc(e.question) + '</span> ' + esc(e.answer) + '</li>'; }).join('') + '</ul>'; }
  function renderReport() {
    if (!S.lead) { S.phase = 'form'; render(); return; }
    if (!ensureResult()) { S.phase = 'q'; render(); return; }
    var r = S.result.report, f = r.priority;
    var dt = new Date(S.lead.at || Date.now()).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    var h = '<article class="report"><header><h1>Your detailed diagnostic</h1><p class="muted">Based on what you told us on ' + esc(dt) +
      '. We haven’t looked at your accounts, website or data, so treat this as a well-informed starting point.' + (r.limited ? ' Because your business model sits outside our standard categories, it is limited to what you told us.' : '') + '</p></header>';

    h += '<div class="glance"><p><b>Look at this first:</b> ' + esc(r.glance.priority) + '</p><p><b>Your first step:</b> ' + esc(r.glance.next) + '</p>' +
      (r.supporting.length ? '<p><b>Also worth a look:</b> ' + esc(r.supporting.map(function (x) { return x.area; }).join('; ')) + '</p>' : '') + '</div>';

    // 1. Situation
    h += sec(1, 'Your situation', '<dl class="summary">' + r.situation.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd class="user-text">' + esc(x[1]) + '</dd>'; }).join('') + '</dl>' +
      '<p>' + esc(r.reported) + '</p>' +
      (r.notes ? '<p class="ctx user-text"><span class="lbl">Your earlier notes, as you wrote them</span>' + esc(r.notes) + '<br><span class="muted">Saved with an earlier version of this check. Shown for context only, not used to decide the findings.</span></p>' : '') +
      (r.legacy ? '<p class="muted">This report was saved with an earlier version of the check, which asked about previous changes differently. Your earlier answer is shown in your notes above, and the findings do not assume what it means.</p>' : ''));

    // 2. Priority finding
    h += sec(2, 'The main thing to look at', '<div class="card pri"><span class="tag t0">Start here</span><h3>' + esc(cap(f.area)) + '</h3>' +
      '<p class="lbl">Why this one first</p><p>' + esc(r.priorityWhy) + '</p>' +
      (f.attempt ? '<p class="attempt">' + esc(f.attempt.note) + '</p>' : '') +
      (f.evidence.length ? '<p class="lbl">What you told us</p>' + evList(f) : '') +
      (r.strength ? '<p class="muted" style="margin:10px 0 0">' + esc(r.strength) + '</p>' : '') + '</div>');

    // 3. Supporting findings
    h += sec(3, 'Also worth a look', r.supporting.length ? r.supporting.map(function (x) {
      return '<div class="card"><span class="tag t1">Worth checking too</span><h3>' + esc(cap(x.area)) + '</h3><p>' + esc(x.impact) + '</p>' +
        '<details><summary>Why we think so</summary><div class="in">' + evList(x) + (x.attempt ? '<p class="attempt" style="margin-top:10px">' + esc(x.attempt.note) + '</p>' : '') + '</div></details></div>';
    }).join('') : '<p class="muted">Nothing else stood out strongly in your answers, so we’ve kept the focus on the one area above.</p>');

    // 4. What could explain this
    h += sec(4, 'What could be behind it', '<p class="muted">These are possible causes, and none of them is confirmed yet. What we do know is what you told us above.</p>' +
      r.explain.map(function (g, i) {
        var list = '<ul class="list">' + g.items.map(function (w) { return '<li>' + esc(w.c) + (w.tag ? '<span class="xtag">' + esc(w.tag) + '</span>' : '') + '</li>'; }).join('') + '</ul>';
        return i === 0 ? '<h3>' + esc(cap(g.area)) + '</h3>' + list : '<details><summary>' + esc(cap(g.area)) + '</summary><div class="in">' + list + '</div></details>';
      }).join('') +
      r.conflicts.map(function (x) { return '<p class="ctx">' + esc(x) + '</p>'; }).join('') +
      '<details><summary>What we don’t know yet</summary><div class="in"><ul class="list">' + r.unknowns.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></details>');

    // 5. What to check
    function checkList(g) { return '<ol class="checks">' + (g.first ? '<li class="first"><span class="for">Start here, since you’ve already made changes</span>' + esc(g.first) + '</li>' : '') +
      g.items.map(function (w) { return '<li><span class="for">If it’s this: ' + esc(w.c) + '</span>' + esc(w.k) + '</li>'; }).join('') + '</ol>'; }
    h += sec(5, 'How to check', r.checks.map(function (g, i) {
      return i === 0 ? '<h3>' + esc(cap(g.area)) + '</h3>' + checkList(g) : '<details><summary>' + esc(cap(g.area)) + '</summary><div class="in">' + checkList(g) + '</div></details>';
    }).join('') + '<p class="lbl" style="margin-top:16px">Records worth pulling together</p><ul class="list">' + r.records.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>');

    // 6. What to do next
    h += sec(6, 'What to do next', '<ol class="actions">' + r.actions.map(function (a) { return '<li><strong>' + esc(a.title) + '</strong>' + esc(a.text) + '</li>'; }).join('') + '</ol>');

    // 7. What to measure
    h += sec(7, 'What to measure', '<div class="measures">' + r.measures.map(function (m) { return '<div><b>' + esc(m[0]) + '</b>' + esc(m[1]) + '</div>'; }).join('') + '</div>');

    // Keep link
    if (!S.lead.test) h += '<section class="keep"><h2>Keep this report</h2><p>Save this link to reopen your report later on any device. <strong>Anyone with the link can see your answers and results</strong> (not your name or contact details), so share it only with people you trust.</p>' +
      '<div class="keep-row"><label class="sr" for="keeplink">Link to reopen this report</label><input type="text" id="keeplink" readonly value="' + esc(reportLink()) + '"><button class="btn btn-ghost" id="copylink" type="button">Copy link</button></div><p class="hint" id="copied" role="status"></p></section>';

    // 8. Optional review
    h += '<section class="review" id="review"><h2>Want a second pair of eyes on this?</h2><p>This is optional. The Morning Owl can go through the underlying information with you and help work out what deserves attention first.</p><div id="discuss"></div></section>';
    h += '<div class="after"><button class="btn-link" id="print" type="button">Print or save as PDF</button><button class="btn-link" id="again" type="button">Start a new check</button></div></article>';

    app.innerHTML = ''; app.appendChild(el(h));
    renderDiscuss();
    document.getElementById('print').onclick = function () { app.querySelectorAll('details').forEach(function (d) { d.open = true; }); window.print(); };
    var cb = document.getElementById('copylink');
    if (cb) cb.onclick = function () { var i = document.getElementById('keeplink'), done = function () { document.getElementById('copied').textContent = 'Link copied.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(i.value).then(done, function () { i.select(); document.execCommand('copy'); done(); });
      else { i.select(); document.execCommand('copy'); done(); } };
    document.getElementById('again').onclick = function () { if (confirm('Start a new check? Your current answers will be cleared from this page.')) { S = fresh(); clearSaved(); if (location.hash) history.replaceState(null, '', location.pathname + location.search); render(); } };
  }

  function renderDiscuss() {
    var box = document.getElementById('discuss'); if (!box) return;
    var d = S.discuss;
    if (d === 'done') { saveState(); box.innerHTML = '<div class="done" role="status">Thanks. The Morning Owl will contact you by email about these results.</div>'; return; }
    box.innerHTML = (d && d.error ? '<div class="alert" role="alert">' + esc(d.error) + '</div>' : '') +
      '<button class="btn btn-accent" id="disc" type="button"' + (d === 'sending' ? ' disabled aria-busy="true"' : '') + '>' + (d === 'sending' ? 'Sending…' : d && d.error ? 'Try again' : 'Discuss my results with TMO') + '</button>';
    document.getElementById('disc').onclick = discuss;
  }

  function discuss() {
    if (S.discuss === 'sending' || S.discuss === 'done') return;
    if (S.lead.test) { S.discuss = 'done'; renderDiscuss(); return; }
    S.discuss = 'sending'; renderDiscuss();
    fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', body: JSON.stringify({ action: 'discuss', lead_id: S.lead.id, token: S.lead.token }) })
      .then(function (res) { return res.json().catch(function () { return {}; }); })
      .then(function (j) { if (j && j.ok) { S.discuss = 'done'; track('discuss_requested'); FUNNEL.send('discuss', null, 'discuss'); } else S.discuss = { error: 'We couldn’t send your request. Select Try again, or email info@themorningowl.co.' }; renderDiscuss(); })
      .catch(function () { S.discuss = { error: 'We couldn’t reach our server. Check your connection and select Try again, or email info@themorningowl.co.' }; renderDiscuss(); });
  }

  /* ---------- progress that survives a refresh (this browser tab only) ----------
     Saved on every answer, including typed text. Stores answers, position, the submission ID and,
     once unlocked, the report's ID and access token. Name, email and website are never stored. */
  var SAVE_KEY = 'tmo_diag_v2', OLD_KEYS = ['tmo_diag_v1'];
  function saveState() {
    if (TEST) return;
    try { sessionStorage.setItem(SAVE_KEY, JSON.stringify({ phase: S.phase, key: S.key, answers: S.answers, lead: S.lead, subId: S.subId, discuss: S.discuss === 'done' ? 'done' : null })); } catch (e) {}
  }
  function clearSaved() { try { sessionStorage.removeItem(SAVE_KEY); OLD_KEYS.forEach(function (k) { sessionStorage.removeItem(k); }); } catch (e) {} }
  function loadSaved() {
    if (TEST) return;
    var d = null;
    try { d = JSON.parse(sessionStorage.getItem(SAVE_KEY) || 'null'); if (!d) { d = JSON.parse(sessionStorage.getItem(OLD_KEYS[0]) || 'null'); } } catch (e) { d = null; }
    if (!d || !d.answers || typeof d.answers !== 'object') return;
    S.answers = RL.prune(RL.migrate(d.answers)); S.key = d.key || 'q1'; S.lead = d.lead || null; S.subId = d.subId || null; S.discuss = d.discuss || null;
    var phase = d.phase || 'intro';
    if (phase === 'overview' || phase === 'form' || phase === 'report') {
      S.result = RL.analyse(S.answers);
      if (!S.result) { phase = 'q'; }
      if (phase === 'report' && !S.lead) phase = 'form';
      if (phase === 'form') { if (S.lead) phase = 'report'; S.formOpenedAt = Date.now(); }
    }
    if (phase === 'q' && !stepByKey(S.key)) S.key = steps()[steps().length - 1].key;
    S.phase = phase;
  }
  function reportLink() { return location.origin + location.pathname + '#report=' + S.lead.id + '.' + S.lead.token; }
  function restoreFromLink(done) {
    var m = /^#report=([a-f0-9]{16,40})\.([a-f0-9]{64})$/.exec(location.hash);
    if (!m) return done();
    if (!CONFIG.endpoint) { S.linkError = 'Report links aren’t switched on yet on this page.'; return done(); }
    app.innerHTML = '<p class="loading" role="status">Opening your report…</p>';
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl ? ctl.signal : undefined, body: JSON.stringify({ action: 'restore', lead_id: m[1], token: m[2] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(timer);
        var ans = j && j.ok && j.answers ? RL.migrate(j.answers) : null, res = ans ? RL.analyse(ans) : null;
        if (res) { FUNNEL.send('report_link', null, 'report_link'); S.answers = ans; S.result = res; S.lead = { id: m[1], token: m[2], method: j.method, at: j.submitted_at ? Date.parse(j.submitted_at) : Date.now() }; S.phase = 'report'; S.discuss = j.discussed ? 'done' : null; }
        else S.linkError = 'We couldn’t open that report link. It may be incomplete or out of date. You can run the check again, or email info@themorningowl.co.';
        history.replaceState(null, '', location.pathname + location.search); done();
      })
      .catch(function () {
        clearTimeout(timer);
        app.innerHTML = '<div class="alert" role="alert">We couldn’t reach our server to open your report. Check your connection and try again.<br><button class="btn btn-primary" type="button" id="retrylink" style="margin-top:12px">Try again</button></div>';
        document.getElementById('retrylink').onclick = function () { restoreFromLink(done); };
      });
  }

  function render() {
    saveState();
    document.body.classList.toggle('is-intro', S.phase === 'intro');
    if (S.phase === 'intro') renderIntro();
    else if (S.phase === 'q') renderQuestion();
    else if (S.phase === 'overview') renderOverview();
    else if (S.phase === 'form') renderForm();
    else if (S.phase === 'report') renderReport();
    focusHeading();
  }
  loadSaved();
  restoreFromLink(render);
})();
</script>
</body>
</html>
